version: '3.9'

networks:
  tentalents-network:

services:
  # ---------- Infrastructure ----------
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - tentalents-network

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tentalents
    ports:
      - "5432:5432"
    networks:
      - tentalents-network

  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    networks:
      - tentalents-network

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    networks:
      - tentalents-network

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT}:9000"
      - "9001:9001"
    networks:
      - tentalents-network

  swagger:
    image: swaggerapi/swagger-ui
    container_name: swagger
    environment:
      SWAGGER_JSON_URL: ${SWAGGER_JSON_URL}
    ports:
      - "8080:8080"
    networks:
      - tentalents-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    networks:
      - tentalents-network

  # ---------- Services ----------
  user-service:
    build:
      context: .
      dockerfile: Dockerfile.user
    environment:
      DATABASE_URL: ${USER_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${USER_SERVICE_PORT}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  product-service:
    build:
      context: .
      dockerfile: Dockerfile.product
    environment:
      DATABASE_URL: ${PRODUCT_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${PRODUCT_SERVICE_PORT}
    ports:
      - "${PRODUCT_SERVICE_PORT}:${PRODUCT_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  order-service:
    build:
      context: .
      dockerfile: Dockerfile.order
    environment:
      DATABASE_URL: ${ORDER_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${ORDER_SERVICE_PORT}
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  rating-service:
    build:
      context: .
      dockerfile: Dockerfile.rating
    environment:
      DATABASE_URL: ${RATING_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${RATING_SERVICE_PORT}
    ports:
      - "${RATING_SERVICE_PORT}:${RATING_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  email-service:
    build:
      context: .
      dockerfile: Dockerfile.email
    environment:
      DATABASE_URL: ${EMAIL_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${EMAIL_SERVICE_PORT}
    ports:
      - "${EMAIL_SERVICE_PORT}:${EMAIL_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
    networks:
      - tentalents-network

  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    environment:
      DATABASE_URL: ${PAYMENT_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${PAYMENT_SERVICE_PORT}
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  search-service:
    build:
      context: .
      dockerfile: Dockerfile.search
    environment:
      DATABASE_URL: ${SEARCH_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${SEARCH_SERVICE_PORT}
    ports:
      - "${SEARCH_SERVICE_PORT}:${SEARCH_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  cart-service:
    build:
      context: .
      dockerfile: Dockerfile.cart
    environment:
      DATABASE_URL: ${CART_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${CART_SERVICE_PORT}
    ports:
      - "${CART_SERVICE_PORT}:${CART_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  admin-service:
    build:
      context: .
      dockerfile: Dockerfile.admin
    environment:
      DATABASE_URL: ${ADMIN_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
