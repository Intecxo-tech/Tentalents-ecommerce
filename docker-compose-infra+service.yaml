    ports:
      - "${ADMIN_SERVICE_PORT}:${ADMIN_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  invoice-service:
    build:
      context: .
      dockerfile: Dockerfile.invoice
    environment:
      DATABASE_URL: ${INVOICE_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${INVOICE_SERVICE_PORT}
    ports:
      - "${INVOICE_SERVICE_PORT}:${INVOICE_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
      - minio
    networks:
      - tentalents-network

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.analytics
    environment:
      DATABASE_URL: ${ANALYTICS_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
      SERVICE_PORT: ${ANALYTICS_SERVICE_PORT}
    ports:
      - "${ANALYTICS_SERVICE_PORT}:${ANALYTICS_SERVICE_PORT}"
    depends_on:
      - redis
      - kafka
      - postgres
    networks:
      - tentalents-network

  vendor-service:
    build:
      context: .
      dockerfile: Dockerfile.vendor
    environment:
      DATABASE_URL: ${VENDOR_SERVICE_DB}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BROKER: ${KAFKA_BROKERS}
