version: "3.9"

networks:
  tentalents-network:
    driver: bridge
  microservices:
    driver: bridge

volumes:
  pgdata:
  redis-data:
  minio-data:

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tentalents}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tentalents-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      retries: 5
      timeout: 5s

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - tentalents-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_pass}", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s

  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    networks:
      - tentalents-network
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      retries: 5
      timeout: 5s

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - tentalents-network
    healthcheck:
      test: ["CMD", "mc", "alias", "set", "local", "http://minio:9000", "${MINIO_ACCESS_KEY:-minioadmin}", "${MINIO_SECRET_KEY:-minioadmin}"]
      interval: 10s
      retries: 5
      timeout: 5s

  # ---------- Microservice (replace for each service) ----------
  <SERVICE_NAME>:
    build:
      context: ./apps/<SERVICE_NAME>        # Replace <SERVICE_NAME> with actual folder
      dockerfile: Dockerfile
    container_name: <SERVICE_NAME>         # Replace <SERVICE_NAME> with container name
    env_file:
      - .env
    environment:
      DATABASE_URL: ${<SERVICE_DB>}         # Replace <SERVICE_DB> with the DB env variable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_pass}
      KAFKA_BROKER: kafka:9092
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      SERVICE_PORT: ${<SERVICE_PORT>}       # Replace <SERVICE_PORT> with the service port
    ports:
      - "${<SERVICE_PORT>}:${<SERVICE_PORT>}"
    networks:
      - microservices
      - tentalents-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${<SERVICE_PORT>}/healthz || exit 1"]
      interval: 15s
      retries: 5
      timeout: 5s







